<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5</title>
</head>
<body>
    <h1>Mensaje de bienvenida</h1>

    <button onclick="mostrarMensaje('Добро пожаловать', 'red')">Ruso</button>
    <button onclick="mostrarMensaje('Bienvenido', 'green')">Español</button>
    <button onclick="mostrarMensaje('Welcome', 'blue')">Inglés</button>

    <!-- Aquí se escribirá el mensaje -->
    <p id="mensaje"></p>

    <script>
        // texto: el mensaje | color: el color que tendrá
        function mostrarMensaje(texto, color) {
            let parrafo = document.getElementById("mensaje");
            parrafo.innerHTML = texto;
            parrafo.style.color = color;
        }
    </script>
</body>
</html>
