<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
</head>
<body>
    <script>
        //Realiza un programa JavaScript que calcule el área y la longitud de una circunferencia de radio 5.
        const radio = 5;

        let area = 3.14 * radio * radio;
        let longitud = 2 * 3.14 * radio;

        document.write("El área es: " + area + "<br>");
        document.write("La longitud es: " + longitud);
    </script>
</body>
</html>
