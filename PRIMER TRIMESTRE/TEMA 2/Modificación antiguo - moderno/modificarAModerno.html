<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tema 2 - Eventos modernos</title>
</head>
<body>

  <h2>Eventos con addEventListener</h2>

  <!--Lo que he hecho es ponerlo con id en vez de con onclick.-->
  <button id="boton">1. Hacer clic aquí</button>

  <br><br>

  <!---Aquí lo mismo, se usa id en vez de onmouseover.-->
  <div id="caja" style="background: #e2e8f0; padding: 10px; width: 250px;">
    2. Pasa el ratón por encima de esta caja
  </div>

  <hr>

  <!--Id en vez de oninput.-->
  <label>3. Escribe tu nombre (input):</label><br>
  <input type="text" id="nombre">

  <br><br>

  <!--Id en vez de onkeyup.-->
  <label>4. Escribe un texto (keyup):</label><br>
  <input type="text" id="texto">

  <p id="salida"></p>

  <script>
    //Const porque estos elementos no los cambiaré.
    const salida = document.getElementById("salida");
    const boton = document.getElementById("boton");
    const caja = document.getElementById("caja");
    const nombre = document.getElementById("nombre");
    const texto = document.getElementById("texto");

    boton.addEventListener("click", function () {
      salida.innerText = "¡Has hecho clic en el botón!";
    });

    caja.addEventListener("mouseover", function () {
      caja.innerText = "¡El ratón está sobre la caja!";
    });

    nombre.addEventListener("input", function () {
      salida.innerText = "Nombre en tiempo real: " + nombre.value;
    });

    texto.addEventListener("keyup", function () {
      console.log("Número de caracteres (Consola F12): " + texto.value.length);
    });
  </script>

</body>
</html>
