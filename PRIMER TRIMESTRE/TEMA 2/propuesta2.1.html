<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 2.1</title>
</head>
<body>
    <script>
        //Suma.
        function suma(z, k) {
            return z + k;
        }

        //Resta.
        function resta(z, k) {
            return z - k;
        }

        //Multiplicación.
        function multiplicacion(z, k) {
            return z * k;
        }

        //División.
        function division(z, k) {
            return z / k;
        }

        let z = suma(3, 3);
        z = suma(z, 3);
        let text = "El valor de z será ahora: " + z;
        console.log(text);

        console.log("Resta: " + resta(10, 4));
        console.log("Multiplicación: " + multiplicacion(5, 3));
        console.log("División: " + division(20, 4));
    </script>
</body>
</html>
