<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletín de notas - Notas</title>
  <link rel="stylesheet" href="pequeñoRetoCSS.css">
</head>
<body>

<h1>Boletín de notas de la clase</h1>

<!-- Tabla de notas (se dibuja desde JavaScript) -->
<div class="panel">
  <h2>Notas por trimestre</h2>
  <div id="tabla"></div>
</div>

<!-- Añadir alumno -->
<div class="panel">
  <h2>Añadir alumno</h2>
  Nombre: <input type="text" id="nuevoNombre">
  1T: <input type="number" id="n1" min="0" max="10">
  2T: <input type="number" id="n2" min="0" max="10">
  3T: <input type="number" id="n3" min="0" max="10">
  <button onclick="anadirAlumno()">Añadir</button>
  <div id="mensaje"></div>
</div>

<!-- Consultas -->
<div class="panel">
  <h2>Consultas</h2>
  <button onclick="contarAprobados()">Contar aprobados</button>
  <button onclick="mejorNotaClase()">Mejor nota de la clase</button>
  <button onclick="mediaTrimestre()">Media de un trimestre</button>
  <select id="trimestre">
    <option value="0">1º trimestre</option>
    <option value="1">2º trimestre</option>
    <option value="2">3º trimestre</option>
  </select>
  <br>
  <input type="text" id="buscarNombre" placeholder="Nombre del alumno">
  <button onclick="buscarAlumno()">Buscar alumno</button>

  <h3>Resultado</h3>
  <div id="resultado"></div>
</div>


<script>
  // ===== DATOS =====
  let alumnos = ["Ana", "Luis", "Marta", "Pablo", "Sara"];

  let notas = [
    [7, 8, 9],
    [4, 5, 6],
    [3, 4, 2],
    [9, 10, 9],
    [5, 4, 6]
  ];

  // ===== FUNCIONES DE CÁLCULO =====

  function mediaAlumno(fila) {
    let suma = 0;
    for (let c = 0; c < notas[fila].length; c++) {
      suma = suma + notas[fila][c];
    }
    return suma / notas[fila].length;
  }

  function calificacion(nota) {
    if (nota < 5) {
      return "Insuficiente";
    } else if (nota < 6) {
      return "Suficiente";
    } else if (nota < 7) {
      return "Bien";
    } else if (nota < 9) {
      return "Notable";
    } else {
      return "Sobresaliente";
    }
  }

  // ===== DIBUJAR LA TABLA =====

  function pintarTabla() {
    let html = "<table>";
    html = html + "<tr><th>Alumno</th><th>1T</th><th>2T</th><th>3T</th><th>Media</th><th>Calificación</th></tr>";

    for (let f = 0; f < notas.length; f++) {
      html = html + "<tr>";
      html = html + "<td>" + alumnos[f] + "</td>";

      for (let c = 0; c < notas[f].length; c++) {
        let nota = notas[f][c];
        if (nota >= 5) {
          html = html + "<td class='aprobado'>" + nota + "</td>";
        } else {
          html = html + "<td class='suspenso'>" + nota + "</td>";
        }
      }

      let media = mediaAlumno(f);
      html = html + "<td><b>" + media.toFixed(2) + "</b></td>";
      html = html + "<td>" + calificacion(media) + "</td>";
      html = html + "</tr>";
    }

    html = html + "</table>";
    document.getElementById("tabla").innerHTML = html;
  }

  // ===== AÑADIR ALUMNO =====

  function anadirAlumno() {
    let nombre = document.getElementById("nuevoNombre").value;
    let n1 = Number(document.getElementById("n1").value);
    let n2 = Number(document.getElementById("n2").value);
    let n3 = Number(document.getElementById("n3").value);

    if (nombre === "") {
      document.getElementById("mensaje").innerHTML = "Error: escribe un nombre.";
      return;
    }
    if (n1 < 0 || n1 > 10 || n2 < 0 || n2 > 10 || n3 < 0 || n3 > 10) {
      document.getElementById("mensaje").innerHTML = "Error: las notas deben estar entre 0 y 10.";
      return;
    }

    alumnos.push(nombre);
    notas.push([n1, n2, n3]);
    document.getElementById("mensaje").innerHTML = "Añadido " + nombre + ". Ahora hay " + alumnos.length + " alumnos.";
    pintarTabla();
  }

  // ===== CONSULTAS =====

  // Función para escribir en el cuadro de resultado
  function mostrarResultado(texto) {
    document.getElementById("resultado").innerHTML = texto;
  }

  // Cuenta los alumnos cuya media es 5 o más
  function contarAprobados() {
    let aprobados = 0;
    for (let f = 0; f < notas.length; f++) {
      if (mediaAlumno(f) >= 5) {
        aprobados++;
      }
    }
    mostrarResultado("Aprobados: " + aprobados + " de " + alumnos.length);
  }

  // Busca la nota más alta de toda la tabla y quién la tiene
  function mejorNotaClase() {
    let mejor = -1;
    let quien = "";
    let trimestre = 0;

    for (let f = 0; f < notas.length; f++) {
      for (let c = 0; c < notas[f].length; c++) {
        if (notas[f][c] > mejor) {
          mejor = notas[f][c];
          quien = alumnos[f];
          trimestre = c + 1;
        }
      }
    }
    mostrarResultado("Mejor nota: " + mejor + " (" + quien + ", " + trimestre + "º trimestre)");
  }

  // Media de la clase en el trimestre elegido en el select
  function mediaTrimestre() {
    let c = Number(document.getElementById("trimestre").value);
    let suma = 0;

    for (let f = 0; f < notas.length; f++) {
      suma = suma + notas[f][c];
    }
    let media = suma / notas.length;
    mostrarResultado("Media del " + (c + 1) + "º trimestre: " + media.toFixed(2));
  }

  // Busca un alumno por su nombre y enseña sus datos
  function buscarAlumno() {
    let nombre = document.getElementById("buscarNombre").value.toLowerCase();
    let posicion = -1;

    for (let f = 0; f < alumnos.length; f++) {
      if (alumnos[f].toLowerCase() === nombre) {
        posicion = f;
      }
    }

    if (posicion === -1) {
      mostrarResultado("No se ha encontrado ese alumno.");
      return;
    }

    let media = mediaAlumno(posicion);
    mostrarResultado(
      alumnos[posicion] + " está en la posición " + posicion + "\n" +
      "Notas: " + notas[posicion].join(", ") + "\n" +
      "Media: " + media.toFixed(2) + " (" + calificacion(media) + ")"
    );
  }

  // Al cargar la página, dibujamos la tabla
  pintarTabla();
</script>

</body>
</html>
