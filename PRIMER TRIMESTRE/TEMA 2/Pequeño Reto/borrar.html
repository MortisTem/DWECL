<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formularios</title>
  <link rel="stylesheet" href="formCSS.css">
</head>

<body>
  <div class="FormularioDIV">
    <!-- PRIMER FORMULARIO -->
    <form action="">
      <fieldset>
        <legend>Datos personales</legend>

        <label for="name">Nombre</label>
        <input type="text" id="name" placeholder="Ingrese su nombre.">
        <br><br>

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" placeholder="Ingrese su número de telefono.">
        <br><br>
        
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Ingrese su email.">

        <hr>

        <label for="genero"><span class="Genero">Indique su género:</span></label>
        <label class="GeneroPuntos">
        <input type="radio" name="genero" value="masculino">
        Masculino
        </label>

        <label class="GeneroPuntos">
        <input type="radio" name="genero" value="femenino">
        Femenino
        </label>

        <hr>

        <label for="FechaNAC">Fecha de nacimiento:</label>
        <input type="date" id="FechaNAC" name="FechaNAC">

        <hr>

        <label for="contraseña">Contraseña personal:</label>
        <input type="password" id="contraseña" name="contraseña">
        
      </fieldset>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpiar">
    </form>

    <!-- SEGUNDO FORMULARIO -->
    <form action="">
      <fieldset>
        <legend>Otros</legend>

        <label for="juegos">Juego favorito:</label>
        <input type="checkbox" id="Wuthering Waves" name="juegos"
        <label for="Wuthering Waves">Wuthering Waves</label>
        <br>
        <input type="checkbox" id="Geometry Dash" name="juegos"
        <label for="Geometry Dash">Geometry Dash</label>

        <hr>

        <label for="colores">Color favorito:</label>
        <input type="color" id="colores" name="colores">

        <hr>

        <label for="CitaPrevia">Pida cita previa:</label>
        <input type="datetime-local" id="FechaHora" name="FechaHora">
        
        <hr>

        <label for="archivo">Adjunte una imagen de un coche.</label>
        <input type="file" id="archivo" name="archivo">

        <hr>

        <label for="LineaMovible">Mueva la línea:</label>
        <input type="range" id="LineaMovible" name="LineaMovible">

        <hr>

        <label for="numeros2">Aumente o disminuya el número introducido:</label>
        <input type="number" id="numeros2" name="numeros2">

        <hr>

        <label for="contraseña">Introduzca una contraseña:<br><i>(Debe contener mínimo una mayúscula, una minúscula y un dígito)</i></label>
        <input type="password" id="contarseña" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d).+" placeholder="Contraseña">
      </fieldset>
      <input type="submit">
      <input type="reset" value="Limpiar">
    </form>

    <!-- TERCER FORMULARIO -->
    <form action="">
      <fieldset>
        <legend>Más</legend>
        
        <label for="FechaRandom">Escriba cualquier fecha:</label>
        <input type="month" id="FechaRandom" name="FechaRandom">

        <hr>

        <label for="hora">Introduzca su hora local:</label>
        <input type="time" id="hora" name="hora">

        <hr>

        <label for="url">Introduzca un enlace:</label>
        <input type="url" id="enlace" name="url">

        <hr>

        <label for="semanas">Indique una semana:</label>
        <input type="week" id="semanas" name="semanas">

        <hr>

        <label for="select">Indique su marca de coche favorita:</label>
        <input type="text" id="select" name="seleccion" list="marcas">
        <datalist id="marcas">
          <option value="Lamborghini"></option>
          <option value="BMW"></option>
          <option value="Porsche"></option>
          <option value="Audi"></option>
        </datalist>

        <hr>

        <label for="edad">Introduce su edad:</label>
        <input type="number" id="edad" min="18" max="65">

        <hr>

        <label for="numero_telefono">Introduzca su número de teléfono:</label>
        <input type="tel" id="numero_telefono" pattern="\d{3}-\d{3}-\d{3}" placeholder="666-666-666">
      </fieldset>
      <input type="submit">
      <input type="reset" value="Limpiar">
    </form>
  </div>
</body> 
</html>
