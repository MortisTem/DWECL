<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <script>
        const notas = [6, 3.5, 8, 9.5, 4, 7];

        const aprobadas = [];  
        let suma = 0;        
        let maxima = 0;      

        for (let i = 0; i < notas.length; i++) {
        const nota = notas[i];   

        if (nota >= 5) {        
            aprobadas.push(nota);  
        }

        suma = suma + nota;     

        if (nota > maxima) {     
            maxima = nota;         
        }
        }

        const media = (suma / notas.length).toFixed(2);

        console.log("Aprobadas:", aprobadas);
        console.log("Media:", media);
        console.log("Nota más alta:", maxima);
    </script>
</body>
</html>
