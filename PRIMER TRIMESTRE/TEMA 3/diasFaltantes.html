<body>
    <script>
    function diasHasta(fecha) {
    const hoy = new Date();
    const dias = Math.ceil((fecha - hoy) / 86400000);
    return dias;
}

const cumple = new Date(2026, 11, 25);

console.log("Faltan " + diasHasta(cumple) + " días para mi cumpleaños.");
</script>
