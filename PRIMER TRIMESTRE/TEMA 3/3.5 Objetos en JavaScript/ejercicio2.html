<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <script>
        class Producto {
            constructor(nombre, precio, stock) {
                this.nombre = nombre;
                this.precio = precio;
                this.stock = stock;
            }

            conIVA() {
                return this.precio * 1.21;
            }

            vender(n) {
                if (this.stock >= n) {
                    this.stock -= n;
                    return true;
                } else {
                    return false;
                }
            }
        }

        const producto1 = new Producto("Teclado", 20, 5);

        document.write("Precio con IVA: " + producto1.conIVA() + "<br>");
        document.write("Vender 3: " + producto1.vender(3) + "<br>");  
        document.write("Stock: " + producto1.stock + "<br>");          
        document.write("Vender 10: " + producto1.vender(10) + "<br>"); 
        document.write("Stock: " + producto1.stock + "<br>");      
    </script>
</body>
</html>
